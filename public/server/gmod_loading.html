<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Server Loading Screen</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html,
			body {
				width: 100%;
				height: 100%;
				overflow: hidden;
				font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
				background-color: #000000;
			}

			/* Stretched background GIF covering entire viewport */
			.bg-gif {
				position: absolute;
				top: 0;
				left: 0;
				width: 100vw;
				height: 100vh;
				object-fit: fill; /* Stretches to fill dimensions without cropping */
				z-index: 1;
			}

			/* Centered overlay card for status & addon list */
			.center-container {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				z-index: 2;
				width: 520px;
				max-width: 90%;
				background: rgba(10, 10, 15, 0.75);
				padding: 20px 24px;
				border-radius: 12px;
				border: 1px solid rgba(255, 255, 255, 0.15);
				box-shadow: 0 10px 40px rgba(0, 0, 0, 0.85);
				backdrop-filter: blur(10px);
				color: #ffffff;
			}

			.header-row {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 12px;
				font-size: 14px;
			}

			#status-text {
				font-weight: 300;
				color: #ffffff;
				letter-spacing: 0.5px;
			}

			#file-count {
				color: #a0a0a0;
				font-size: 13px;
			}

			/* Progress Bar */
			.progress-track {
				width: 100%;
				height: 8px;
				background: rgba(255, 255, 255, 0.15);
				border-radius: 4px;
				overflow: hidden;
				margin-bottom: 14px;
			}

			.progress-bar {
				width: 0%;
				height: 100%;
				background: #00d2ff;
				transition: width 0.2s ease;
			}

			/* Scrolling Addon Download History List */
			.download-list {
				list-style: none;
				max-height: 130px;
				overflow-y: hidden;
				display: flex;
				flex-direction: column-reverse; /* Keeps the newest download at the bottom */
				gap: 5px;
				font-family: "Consolas", "Courier New", monospace;
				font-size: 12px;
				color: #70e000;
			}

			.download-list li {
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				opacity: 0.9;
				text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
			}

		</style>
	</head>
	<body>
		<!-- REPLACE WITH YOUR QUAGMIRE GIF URL -->
		<img
			class="bg-gif"
			src="https://media.tenor.com/eZrIJ4lfXEMAAAAM/backrooms.gif"
			alt="Background"
		/>

		<div class="center-container">
			<h1>Lee's Sandbox</h1>
			<div class="header-row">
				<span id="status-text">Connecting to server...</span>
				<span id="file-count"></span>
			</div>

			<div class="progress-track">
				<div id="progress-fill" class="progress-bar"></div>
			</div>

			<ul id="addon-history" class="download-list"></ul>
		</div>

		<script>
			let totalFiles = 0;
			let filesRemaining = 0;

			// Called when GMod transitions loading stages
			function SetStatusChanged(status) {
				document.getElementById("status-text").innerText = status;
			}

			// Called once when total files to download is determined
			function SetFilesTotal(total) {
				totalFiles = total;
				updateProgress();
			}

			// Called each time a file finishes and remaining count drops
			function SetFilesNeeded(needed) {
				filesRemaining = needed;
				updateProgress();
			}

			// Called whenever a new addon/file begins downloading
			function DownloadingFile(fileName) {
				const list = document.getElementById("addon-history");
				const item = document.createElement("li");

				item.innerText = "⬇ " + fileName;
				list.appendChild(item);

				// Cap the displayed list to the 8 most recent files
				if (list.children.length > 8) {
					list.removeChild(list.firstChild);
				}
			}

			function updateProgress() {
				if (totalFiles > 0) {
					const downloaded = totalFiles - filesRemaining;
					const percent = Math.min(
						100,
						Math.round((downloaded / totalFiles) * 100),
					);

					document.getElementById("progress-fill").style.width = percent + "%";
					document.getElementById("file-count").innerText =
						`${downloaded} / ${totalFiles} (${percent}%)`;
				}
			}
		</script>
	</body>
</html>

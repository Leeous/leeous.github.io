<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Server MOTD</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html,
			body {
				width: 100%;
				height: 100%;
				overflow: hidden;
				font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
				background-color: #000000;
			}

			/* Stretched background GIF covering entire viewport */
			.bg-gif {
				position: absolute;
				top: 0;
				left: 0;
				width: 100vw;
				height: 100vh;
				object-fit: fill; /* Stretches to fill dimensions */
				z-index: 1;
			}

			/* Centered overlay card */
			.center-container {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				z-index: 2;
				text-align: center;
				background: rgba(0, 0, 0, 0.65);
				padding: 16px 28px;
				border-radius: 8px;
				border: 1px solid rgba(255, 255, 255, 0.15);
				box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
				max-width: 80%;
			}

			.center-container p {
				color: #ffffff;
				font-size: 13px;
				letter-spacing: 0.5px;
				line-height: 1.5;
				text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
			}
		</style>
	</head>
	<body>
		<!-- REPLACE WITH YOUR STRETCHED GIF URL -->
		<img
			class="bg-gif"
			src="https://media.tenor.com/YSshtzRCYwMAAAAM/justinjhamhamilton.gif"
			alt="Background"
		/>
	</body>
</html>
